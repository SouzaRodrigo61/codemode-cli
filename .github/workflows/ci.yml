name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `@stable`: o rust-toolchain.toml do repo e quem manda, pra o
      # clippy do CI ser o mesmo da maquina de quem escreve (#54).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      # A propria biblioteca do repo passa pelo pre-voo: script quebrado em
      # .codemode/ so aparecia quando alguem tentava rodar (#16).
      - name: check da biblioteca .codemode/
        run: |
          cargo build
          for s in .codemode/*.rhai; do ./target/debug/codemode check "$s" || exit 1; done

  bench:
    runs-on: ubuntu-latest
    # Informativo, nunca bloqueante: runner compartilhado varia demais pra
    # regressao de performance ser sinal confiavel. O numero que decide e o
    # antes/depois na mesma maquina (bench/README.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: casos de performance
        run: ./target/release/codemode run .codemode/bench-all.rhai --workdir .
